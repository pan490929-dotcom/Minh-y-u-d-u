
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Little Secret 💗</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Georgia, serif;
  background: linear-gradient(135deg,#ffe5ef,#fff5f8);
  color: #75475b;
  min-height: 100vh;
  overflow-x: hidden;
}

button, input {
  font-family: inherit;
}

button {
  cursor: pointer;
}

.hidden {
  display: none !important;
}

.page {
  min-height: 100vh;
  padding: 25px 16px;
  display: flex;
  justify-content: center;
  align-items: center;
}

.card {
  background: rgba(255,255,255,.9);
  width: 100%;
  max-width: 430px;
  padding: 28px 22px;
  border-radius: 25px;
  box-shadow: 0 10px 35px #d98ba733;
  text-align: center;
  position: relative;
  z-index: 1;
}

h1 {
  color: #d66f9a;
  font-size: 28px;
}

h2 {
  color: #ce7599;
}

p {
  line-height: 1.7;
}

.small {
  font-size: 13px;
  color: #b78398;
}

.heart {
  color: #e78bac;
  font-size: 38px;
  animation: beat 1.2s infinite;
}

@keyframes beat {
  50% { transform: scale(1.2); }
}

.main-btn {
  border: none;
  background: linear-gradient(135deg,#ed9fbd,#d96f9a);
  color: white;
  padding: 13px 22px;
  border-radius: 30px;
  font-size: 16px;
  margin: 7px;
  transition: .2s;
}

.main-btn:active {
  transform: scale(.96);
}

input {
  width: 100%;
  padding: 14px;
  border: 1px solid #efb5cb;
  border-radius: 13px;
  margin: 12px 0;
  font-size: 16px;
  outline: none;
  text-align: center;
  color: #75475b;
}

input:focus {
  border-color: #d66f9a;
}

/* =========================
   1. THỎ VÀ HỘP QUÀ
========================= */

.bunny-page {
  overflow: hidden;
  background: linear-gradient(160deg,#ffe3ee,#fff7fa);
}

.bunny-scene {
  width: 100%;
  max-width: 430px;
  text-align: center;
  position: relative;
}

.welcome-text {
  font-size: 32px;
  animation: fadeIn 1.5s;
}

.welcome-sub {
  color: #bc7893;
}

.bunny {
  margin-top: 50px;
  font-size: 85px;
  opacity: 0;
  transform: translateX(-150vw);
  animation: bunnyWalk 3s ease forwards;
  animation-delay: .5s;
}

@keyframes bunnyWalk {
  0% {
    opacity: 0;
    transform: translateX(-150vw);
  }
  70% {
    opacity: 1;
    transform: translateX(10px);
  }
  85% {
    transform: translateX(-5px);
  }
  100% {
    opacity: 1;
    transform: translateX(0);
  }
}

.bunny-emoji {
  display: inline-block;
  animation: hop 1s infinite;
}

@keyframes hop {
  50% { transform: translateY(-12px); }
}

.gift-area {
  margin-top: -5px;
}

#giftButton {
  font-size: 85px;
  background: none;
  border: none;
  animation: giftShake 1.5s infinite;
  transition: .3s;
}

@keyframes giftShake {
  0%,100% { transform: rotate(0); }
  25% { transform: rotate(-8deg); }
  75% { transform: rotate(8deg); }
}

.tap-text {
  font-size: 13px;
  color: #bc7893;
}

.password-box {
  display: none;
  background: white;
  padding: 22px;
  margin-top: 25px;
  border-radius: 22px;
  box-shadow: 0 8px 25px #d98ba744;
  animation: fadeIn .8s;
}

.password-box.show {
  display: block;
}

.gift-open #giftButton {
  animation: giftOpen .7s forwards;
}

@keyframes giftOpen {
  50% { transform: scale(1.5) rotate(15deg); }
  100% { transform: scale(.5); opacity: 0; }
}

@keyframes fadeIn {
  from {
    opacity: 0;
    transform: translateY(15px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* =========================
   2. MENU
========================= */

.menu {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-top: 22px;
}

.menu button {
  padding: 20px 8px;
  background: #fff0f5;
  color: #a65376;
  border: 1px solid #f3c5d7;
  border-radius: 17px;
  font-size: 15px;
  transition: .2s;
}

.menu button:active {
  transform: scale(.95);
}

.menu button span {
  display: block;
  font-size: 29px;
  margin-bottom: 8px;
}

/* =========================
   3. CÂU HỎI
========================= */

#questionOptions {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-top: 22px;
}

.option {
  width: 100%;
  padding: 14px;
  border: 1px solid #f1c1d3;
  background: #fff3f7;
  color: #a85b7a;
  border-radius: 13px;
  font-size: 15px;
  text-align: left;
}

.option:active {
  background: #fbdce8;
}

#questionResult {
  min-height: 25px;
  color: #d16e96;
  font-weight: bold;
}

/* =========================
   4. CÂU HỎI NGÀY
========================= */

.big-question {
  font-size: 29px;
  line-height: 1.4;
  color: #d45f8e;
}

.date-stage {
  position: relative;
  width: 100%;
  height: 190px;
  margin-top: 20px;
}

.date-btn {
  position: absolute;
  width: 46%;
  min-height: 55px;
  border: 1px solid #eeb3c9;
  background: #fff0f5;
  color: #a65376;
  border-radius: 15px;
  font-size: 15px;
  font-weight: bold;
  transition: left .12s, top .12s;
}

#wrongAnswer {
  left: 2%;
  top: 15px;
  z-index: 2;
}

.correct-date {
  right: 2%;
  top: 15px;
  background: #e98fb1;
  color: white;
}

/* =========================
   5. LỜI NHẮN
========================= */

.letter {
  background: #fff7f9;
  border: 1px dashed #e9a2bb;
  padding: 20px;
  border-radius: 15px;
  text-align: left;
  line-height: 1.9;
  white-space: pre-line;
  margin-top: 20px;
}
/* ALBUM NHẠC */
.album {
  text-align: left;
  margin-top: 20px;
}

.album-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px;
  margin: 12px 0;
  border-radius: 16px;
  background: #fff0f5;
  border: 1px solid #f3c5d7;
}

.album-cover {
  width: 65px;
  height: 65px;
  border-radius: 12px;
  object-fit: cover;
  background: #f8d4e2;
}

.album-info {
  flex: 1;
  min-width: 0;
}

.album-info strong {
  display: block;
  color: #a65376;
}

.album-info small {
  color: #b78398;
}

.album-item button {
  border: none;
  background: #e98fb1;
  color: white;
  border-radius: 50%;
  width: 42px;
  height: 42px;
  font-size: 17px;
}

.add-music {
  margin-top: 20px;
  padding: 15px;
  background: #fff7fa;
  border-radius: 16px;
  text-align: left;
}

.add-music input {
  text-align: left;
}

#musicPlayer {
  width: 100%;
  margin-top: 15px;
  border-radius: 12px;
}

#musicStatus {
  text-align: center;
  font-size: 13px;
  color: #b78398;
}

/* =========================
7. BÍ MẬT - TRÁI TIM 3D
========================= */

#secretPage {
    background: #000;
    padding: 0;
    overflow: hidden;
    position: relative;
    color: white;
}

.secret-background {
    width: 100%;
    height: 100vh;
    min-height: 500px;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    background: radial-gradient(ellipse at center, #190711, #000 75%);
}

#heartCanvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
}

.secret-title {
    position: absolute;
    top: 8%;
    z-index: 2;
    color: #ff9ac4;
    font-size: 24px;
    letter-spacing: 4px;
    text-shadow: 0 0 15px #ff4c99;
}

.secret-subtitle {
    position: absolute;
    bottom: 15%;
    z-index: 2;
    color: #ffb5d2;
    font-size: 17px;
    text-shadow: 0 0 12px #ff4c99;
}

#fallingWords {
    position: absolute;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
    z-index: 1;
}

.love-word {
    position: absolute;
    top: -40px;
    color: #ff9bc5;
    font-weight: bold;
    white-space: nowrap;
    text-shadow: 0 0 10px #ff4081;
    animation: falling 6s linear forwards;
}

@keyframes falling {
    from {
        transform: translateY(-40px);
        opacity: 0;
    }
    10% { opacity: 1; }
    to {
        transform: translateY(110vh);
        opacity: 0;
    }
}

.secret-back {
    position: absolute;
    bottom: 3%;
    z-index: 5;
    background: #ff8db9;
    color: white;
}

<!-- =========================
     MÀN HÌNH THỎ VÀ QUÀ
========================= -->

<section id="lockPage" class="page bunny-page">
  <div class="bunny-scene">

    <h1 class="welcome-text">A Little Secret ♡</h1>
    <p class="welcome-sub">
      Someone has a little surprise...
    </p>

    <div class="bunny">
      <div class="bunny-emoji">🐰</div>
    </div>

      A little gift for someone special 💗
    </p>

      <button id="giftButton" onclick="openGift()">

      </button>
    </div>

    <p class="tap-text">

    </p>

    <div id="passwordBox" class="password-box">

      <input
        id="password"
        type="password"
        placeholder="Enter password..."
      >

      <button class="main-btn" onclick="unlock()">

</section>


<!-- =========================
     CÂU HỎI KỶ NIỆM
========================= -->

<section id="questionPage" class="page hidden">
  <div class="card">

    <div class="heart">💗</div>

    <p id="questionNumber" class="small">
      QUESTION 01 / 03
    </p>

    <h1>How Much Do You Remember?</h1>

    <h2 id="questionText"></h2>

    <div id="questionOptions"></div>

    <p id="questionResult"></p>

    <button
      id="nextQuestionBtn"
      class="main-btn hidden"
      onclick="nextQuestion()"
    >
      Tiếp tục →
    </button>

  </div>
</section>


<!-- =========================
     CÂU HỎI NGÀY HÔM NAY
========================= -->

<section id="datePage" class="page hidden">
  <div class="card date-card">

    <div class="heart">♡</div>

    <h1 class="big-question">
      HÔM NAY LÀ NGÀY BAO NHIÊU?
    </h1>

    <p>Hãy chọn câu trả lời của cậu nhé!</p>

    <div class="date-stage">

      <button
        id="wrongAnswer"
        class="date-btn"
        onclick="runAway()"
        onpointerenter="runAway()"
      >
        A. 19/11
      </button>

      <button
        class="date-btn correct-date"
        onclick="chooseB()"
      >
        B. Anh không biết
      </button>

    </div>

    <p class="small">
      Có một đáp án hơi khó chọn đấy! 🎀
    </p>

  </div>
</section>


<!-- =========================
     MENU CHÍNH
========================= -->

<section id="homePage" class="page hidden">
  <div class="card">

    <div class="heart">♡</div>

    <h1>Our Little World</h1>

    <p>
      Chọn một món quà dành cho anh nhé!
    </p>

    <div class="menu">

      <button onclick="showPage('musicPage')">
        <span>🎵</span>
        Nhạc
      </button>

      <button onclick="showPage('letterPage')">
        <span>💌</span>

      </button>

      <button onclick="openSecret()">
        <span>💗</span>

      </button>

    </div>

    <p class="small">Made with love ♡</p>

  </div>
</section>


<!-- =========================
     TRANG NHẠC
========================= -->

<section id="musicPage" class="page hidden">
  <div class="card">

    <div class="heart">🎧</div>

    <h1>My Little Album</h1>
    <p>Những giai điệu yêu thích ♡</p>

    <div id="albumList" class="album"></div>

    <p id="musicStatus">Chọn một bài hát để nghe nhé 💗</p>

    <iframe
      id="musicPlayer"
      class="hidden"
      width="100%"
      height="210"
      src=""
      title="YouTube music player"
      allow="autoplay; encrypted-media; picture-in-picture"
      allowfullscreen>
    </iframe>

    <audio id="mp3Player" controls class="hidden"
      style="width:100%; margin-top:15px;">
    </audio>

    <div class="add-music">
      <h2>＋ Thêm bài hát</h2>

      <input id="songName" placeholder="Tên bài hát">

      <input id="songArtist" placeholder="Tên ca sĩ">

      <input id="songLink" placeholder="Dán link YouTube hoặc MP3">

      <button class="main-btn" onclick="addSong()">
        Thêm vào album 💗
      </button>
    </div>

    <button class="main-btn"
      onclick="showPage('homePage')">
      Trang chủ
    </button>
  </div>
</section>

<!-- =========================
     TRANG THƯ
========================= -->

<section id="letterPage" class="page hidden">
  <div class="card">

    <div class="heart">💌</div>

    <h1>A Letter For You</h1>

    <p>Một bức thư nhỏ dành riêng cho cậu.</p>

    <button class="main-btn" onclick="openLetter()">
      Mở thư 💗
    </button>

    <div id="letterContent" class="letter hidden"></div>

    <button
      class="main-btn"
      onclick="showPage('homePage')"
    >
      Trang chủ
    </button>

  </div>
</section>


<!-- =========================
     TRANG BÍ MẬT
========================= -->

<section id="secretPage" class="page hidden">

    <div class="secret-background">

        <h1 class="secret-title">
            A SECRET FOR YOU ♡
        </h1>

        <canvas id="heartCanvas"></canvas>

        <div id="fallingWords"></div>

        <p class="secret-subtitle">
            You are my favorite person ♡
        </p>

        <button
            class="main-btn secret-back"
            onclick="showPage('homePage')">
            Quay về 💌
        </button>

    </div>

</section>

<script>

/* =========================
   1. MẬT KHẨU
========================= */

const MY_PASSWORD = "01020203";

function openGift() {

  const scene = document.querySelector(".bunny-scene");
  const box = document.getElementById("passwordBox");

  if (box.classList.contains("show")) return;

  scene.classList.add("gift-open");

  setTimeout(() => {

    box.classList.add("show");

    document.querySelector(".tap-text").textContent =
      "Your surprise is waiting 💗";

    document.getElementById("password").focus();

  }, 650);

}

function unlock() {

  const value = document.getElementById("password").value;

  if (value === MY_PASSWORD) {

    questionIndex = 0;

    renderQuestion();

    showPage("questionPage");

  } else {

    document.getElementById("lockMessage").textContent =
      "Sai mật khẩu rồi, thử lại nhé! 💗";

  }

}


/* =========================
   2. CHUYỂN TRANG
========================= */

function showPage(id) {

  document.querySelectorAll(".page").forEach(page => {
    page.classList.add("hidden");
  });

  document.getElementById(id).classList.remove("hidden");

  if (id !== "secretPage") {
    stopFallingWords();

    const secretMusic = document.getElementById("secretMusic");

    if (secretMusic) {
      secretMusic.src = "";
    }
  }

}
/* =========================
   3. BA CÂU HỎI
========================= */

const questions = [

  {
    q: "Câu 1: Ngày chúng ta gặp nhau là?",
    options: [
      "A. 06/02/2025",
      "B. 03/08/2026",
      "C. 31/01/2025",
      "D. 27/06/2025"
    ],
    answer: 2
  },

  {
    q: "Câu 2: Ngày yêu nhau là?",
    options: [
      "A. 19/08/2026",
      "B. 23/06/2026",
      "C. 08/05/2025",
      "D. 12/02/2026"
    ],
    answer: 0
  },

  {
    q: "Câu 3: Sinh nhật của em?",
    options: [
      "A. 05/12/2009",
      "B. 18/04/2009",
      "C. 29/09/2009",
      "D. 28/09/2009"
    ],
    answer: 3
  }

];

let questionIndex = 0;
let questionLocked = false;

function renderQuestion() {

  const q = questions[questionIndex];

  questionLocked = false;

  document.getElementById("questionNumber").textContent =
    `QUESTION 0${questionIndex + 1} / 03`;

  document.getElementById("questionText").textContent = q.q;

  document.getElementById("questionResult").textContent = "";

  document.getElementById("nextQuestionBtn")
    .classList.add("hidden");

  const area = document.getElementById("questionOptions");

  area.innerHTML = "";

  q.options.forEach((option, index) => {

    const btn = document.createElement("button");

    btn.className = "option";

    btn.textContent = option;

    btn.onclick = () => {

      if (questionLocked) return;

      if (index === q.answer) {

        questionLocked = true;

        btn.style.background = "#d8f4df";

        document.getElementById("questionResult").textContent =
          "Chính xác rồi! Cậu nhớ giỏi quá! 💗";

        document.getElementById("nextQuestionBtn")
          .classList.remove("hidden");

        area.querySelectorAll("button").forEach(b => {
          b.disabled = true;
        });

      } else {

        document.getElementById("questionResult").textContent =
          "Chưa đúng rồi, thử lại nhé! 🌸";

        btn.style.background = "#ffe0e0";

      }

    };

    area.appendChild(btn);

  });

}

function nextQuestion() {

  questionIndex++;

  if (questionIndex < questions.length) {

    renderQuestion();

  } else {

    showPage("datePage");

  }

}


/* =========================
   4. CÂU HỎI NGÀY 19/11
========================= */

function runAway() {

  const btn = document.getElementById("wrongAnswer");

  const stage = document.querySelector(".date-stage");

  const maxX = stage.clientWidth - btn.offsetWidth;

  const maxY = stage.clientHeight - btn.offsetHeight;

  const x = Math.random() * Math.max(0, maxX);

  const y = Math.random() * Math.max(0, maxY);

  btn.style.left = x + "px";

  btn.style.top = y + "px";

}

function chooseB() {

  showPage("homePage");

}


/* =========================
   5. BỨC THƯ
========================= */

function openLetter() {

  const letter = document.getElementById("letterContent");

  letter.classList.remove("hidden");

  letter.textContent =

`Gửi người đặc biệt của mình,

Cảm ơn cậu vì đã xuất hiện.
Mong rằng mỗi ngày của cậu đều có thật nhiều niềm vui.

Dù cuộc sống có bận rộn thế nào,
hãy nhớ rằng luôn có những điều tốt đẹp đang chờ cậu.

Mong chúng ta sẽ có thêm thật nhiều kỷ niệm đáng nhớ.

Thương cậu rất nhiều! 💗

                 From someone special ♡`;

}
/* =========================
   6. ALBUM NHẠC
========================= */

const defaultSongs = [
  {
    name: "Baby",
    artist: "MCK",
    link: "https://youtu.be/n7nt4ixOwmo?si=18NcjnLzXRGjAUp9",
    image: "baby.jpg"
  },
  {
    name: "Chìm Sâu",
    artist: "MCK",
    link: "https://youtu.be/cgCA-jP5QSY?si=NlUc4mSTMX4_HT11",
    image: "chim-sau.jpg"
  },
  {
    name: "Thịt lợn",
    artist: "MCK",
    link: "https://youtu.be/aGIf5h1pCco?si=EnQ1bLqbloyeuYoc",
    image: "thit-lon.jpg"
  },
  {
    name: "Mắt môi tay chân",
    artist: "MCK",
    link: "https://youtu.be/Xk9kczrs8I0?si=oLk2-ASGIvA9m0tG",
    image: "mat-moi-tay-chan.HEIC"
  },
  {
    name: "Nguyễn Văn Mười",
    artist: "MCK",
    link: "https://youtu.be/3IVmlhOHKCQ?si=495pLgOrIlsUFibF",
    image: "nguyen-van-muoi.JPG"
  }
];

let userSongs = [];

try {
  userSongs = JSON.parse(localStorage.getItem("mySongs")) || [];
} catch (error) {
  userSongs = [];
}

let songs = [...defaultSongs, ...userSongs];

function getYouTubeID(link) {
  try {
    const url = new URL(link);

    if (url.hostname.includes("youtu.be")) {
      return url.pathname.slice(1);
    }

    if (url.searchParams.get("v")) {
      return url.searchParams.get("v");
    }

    if (url.pathname.includes("/embed/")) {
      return url.pathname.split("/embed/")[1].split("/")[0];
    }

    if (url.pathname.includes("/shorts/")) {
      return url.pathname.split("/shorts/")[1].split("/")[0];
    }

  } catch (error) {
    return null;
  }

  return null;
}

function renderAlbum() {
  const area = document.getElementById("albumList");

  area.innerHTML = "";

  songs.forEach((song, index) => {
    const item = document.createElement("div");
    item.className = "album-item";

    const cover = document.createElement("img");
    cover.className = "album-cover";
    cover.src = song.image || "";
    cover.alt = song.name;

    cover.onerror = () => {
      cover.style.display = "none";
    };

    const info = document.createElement("div");
    info.className = "album-info";

    const name = document.createElement("strong");
    name.textContent = song.name;

    const artist = document.createElement("small");
    artist.textContent = song.artist || "Unknown artist";

    const button = document.createElement("button");
    button.textContent = "▶";
    button.onclick = () => playSong(index);

    info.appendChild(name);
    info.appendChild(artist);

    item.appendChild(cover);
    item.appendChild(info);
    item.appendChild(button);

    area.appendChild(item);
  });
}

function playSong(index) {
  const song = songs[index];

  const youtube = document.getElementById("musicPlayer");
  const mp3 = document.getElementById("mp3Player");
  const status = document.getElementById("musicStatus");

  youtube.classList.add("hidden");
  mp3.classList.add("hidden");

  youtube.src = "";
  mp3.pause();
  mp3.removeAttribute("src");
  mp3.load();

  const videoID = getYouTubeID(song.link);

  if (videoID) {
    youtube.src =
      "https://www.youtube-nocookie.com/embed/" +
      videoID + "?autoplay=1&rel=0";

    youtube.classList.remove("hidden");
    status.textContent = "Đang phát: " + song.name + " 💗";

  } else if (/\.mp3($|[?#])/i.test(song.link)) {
    mp3.src = song.link;
    mp3.classList.remove("hidden");

    mp3.play().then(() => {
      status.textContent = "Đang phát: " + song.name + " 💗";
    }).catch(() => {
      status.textContent = "Không thể phát bài hát này. Em thử link khác nhé!";
    });

  } else {
    status.textContent = "Link chưa được hỗ trợ!";
  }
}

function addSong() {
  const name = document.getElementById("songName").value.trim();
  const artist = document.getElementById("songArtist").value.trim();
  const link = document.getElementById("songLink").value.trim();

  if (!name || !link) {
    alert("Em hãy nhập tên bài hát và đường link nhé!");
    return;
  }

  const videoID = getYouTubeID(link);
  const isMP3 = /\.mp3($|[?#])/i.test(link);

  if (!videoID && !isMP3) {
    alert("Hãy nhập link YouTube hoặc MP3 nhé!");
    return;
  }

  const newSong = {
    name: name,
    artist: artist || "Unknown artist",
    link: link
  };

  userSongs.push(newSong);
  songs.push(newSong);

  localStorage.setItem("mySongs", JSON.stringify(userSongs));

  renderAlbum();

  document.getElementById("songName").value = "";
  document.getElementById("songArtist").value = "";
  document.getElementById("songLink").value = "";

  document.getElementById("musicStatus").textContent =
    "Đã thêm bài hát vào album! 💗";
}

renderAlbum();

   7. BÍ MẬT TRÁI TIM
========================= */

/* =========================
7. TRÁI TIM 3D XOAY 360°
========================= */

let fallingTimer = null;
let animationID = null;
let heartParticles = [];
let heartAngle = 0;

const canvas = document.getElementById("heartCanvas");
const ctx = canvas.getContext("2d");

function resizeHeart() {
    const rect = canvas.getBoundingClientRect();

    const dpr = window.devicePixelRatio || 1;

    canvas.width = rect.width * dpr;
    canvas.height = rect.height * dpr;

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

window.addEventListener("resize", resizeHeart);

function createHeart() {

    heartParticles = [];

    for (let i = 0; i < 2200; i++) {

        const t = Math.random() * Math.PI * 2;
        const scale = Math.sqrt(Math.random());

        const x = 16 * Math.pow(Math.sin(t), 3);

        const y = 13 * Math.cos(t)
            - 5 * Math.cos(2 * t)
            - 2 * Math.cos(3 * t)
            - Math.cos(4 * t);

        heartParticles.push({
            x: x * scale,
            y: y * scale,
            z: (Math.random() - 0.5) * 9,
            size: Math.random() * 1.5 + 0.5,
            alpha: Math.random() * 0.7 + 0.3
        });
    }
}

function drawHeart() {

    if (document.getElementById("secretPage").classList.contains("hidden")) {
        return;
    }

    const w = canvas.clientWidth;
    const h = canvas.clientHeight;

    ctx.clearRect(0, 0, w, h);

    const scale = Math.min(w / 43, h / 40);

    const centerX = w / 2;
    const centerY = h / 2;

    heartAngle += 0.012;

    function drawParticles(reflection = false) {

        heartParticles.forEach(p => {

            const x = p.x * scale;
            const y = p.y * scale;
            const z = p.z * scale;

            // Xoay trái tim quanh trục Y
            const rx = x * Math.cos(heartAngle)
                - z * Math.sin(heartAngle);

            const rz = x * Math.sin(heartAngle)
                + z * Math.cos(heartAngle);

            const perspective = 450 / (450 + rz);

            const px = centerX + rx * perspective;

            let py = centerY - y * perspective;

            if (reflection) {
                py = centerY + (centerY - py) + 20;
            }

            const size = p.size * perspective;

            ctx.beginPath();

            ctx.arc(px, py, size, 0, Math.PI * 2);

            ctx.fillStyle = reflection
                ? `rgba(255,100,170,${p.alpha * 0.12})`
                : `rgba(255,105,170,${p.alpha})`;

            ctx.shadowBlur = reflection ? 2 : 10;
            ctx.shadowColor = "#ff3288";

            ctx.fill();

        });

        ctx.shadowBlur = 0;
    }

    // Trái tim phản chiếu
    drawParticles(true);

    // Trái tim chính
    drawParticles(false);

    animationID = requestAnimationFrame(drawHeart);
}

function openSecret() {

    showPage("secretPage");

    resizeHeart();

    if (animationID) {
        cancelAnimationFrame(animationID);
    }

    createHeart();

    drawHeart();

    const area = document.getElementById("fallingWords");

    area.innerHTML = "";

    stopFallingWords();

    fallingTimer = setInterval(() => {

        const word = document.createElement("div");

        word.className = "love-word";

        word.textContent = "EM YÊU ANH ♥";

        word.style.left = Math.random() * 85 + "%";

        word.style.animationDuration =
            (4 + Math.random() * 4) + "s";

        word.style.fontSize =
            (14 + Math.random() * 12) + "px";

        area.appendChild(word);

        setTimeout(() => word.remove(), 8500);

    }, 250);

}

function stopFallingWords() {

    if (fallingTimer) {
        clearInterval(fallingTimer);
        fallingTimer = null;
    }

    if (animationID) {
        cancelAnimationFrame(animationID);
        animationID = null;
    }

}
